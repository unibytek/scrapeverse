services:
  db:
    image: postgres:17-alpine
    container_name: scrapeverse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: osof
    ports:
      - "5432:5432"
    volumes:
      - scrapeverse_pgdata:/var/lib/postgresql/data

volumes:
  scrapeverse_pgdata:
